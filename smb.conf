# ═══════════════════════════════════════════════════════════════════════════════
# ARCHIVO DE CONFIGURACIÓN DE SAMBA — DataCorp
# ═══════════════════════════════════════════════════════════════════════════════
# Proyecto  : Comunicaciones III — Tema 3 — Laboratorio NAS con Samba
# Integrantes: Manuela Marín Rojo, Daniel Trujillo F, Santiago González
# Ubicación : /etc/samba/smb.conf
# Fecha     : Abril 2026
#
# INSTRUCCIONES:
#   1. Reemplaza <INTERFAZ_RED> por el nombre real de tu interfaz de red.
#      Para encontrarlo ejecuta: ip a | grep -E '^[0-9]+:'
#      Ejemplos comunes: eth0, ens33, enp3s0, enp0s3, eno1
#   2. Copia este archivo a /etc/samba/smb.conf
#   3. Valida con: testparm -s
#   4. Reinicia Samba: sudo systemctl restart smbd nmbd
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN [global] — Configuración general del servidor Samba
# ─────────────────────────────────────────────────────────────────────────────
# Esta sección define el comportamiento general del servidor: cómo se identifica
# en la red, cómo autentica usuarios, qué protocolos acepta, etc.
[global]

# Nombre del grupo de trabajo (workgroup). Es como el "vecindario" de red.
# Todos los equipos que quieran verse entre sí deben usar el mismo workgroup.
# En nuestro caso, usamos DATACORP como nombre de la empresa ficticia.
   workgroup = DATACORP

# Descripción del servidor que aparece cuando un cliente explora la red.
# Es solo informativo, no afecta la funcionalidad.
   server string = Servidor NAS DataCorp - Comunicaciones III

# Método de autenticación. "user" significa que cada cliente debe proporcionar
# un nombre de usuario y contraseña registrados en Samba. Es el modo más seguro
# para redes pequeñas sin Active Directory.
   security = user

# Qué hacer cuando alguien intenta conectarse con un usuario que NO existe en
# Samba. "bad user" significa que se le trata como invitado (guest).
# Esto permite que el share [publico] funcione sin autenticación obligatoria.
   map to guest = bad user

# Cuenta del sistema que se usa para acceso de invitados.
# "nobody" es un usuario estándar de Linux con privilegios mínimos.
   guest account = nobody

# ── LOGGING (registro de eventos) ──

# Nivel de detalle de los logs (0=mínimo, 10=máximo). Nivel 2 es suficiente
# para ver errores y conexiones sin llenar el disco.
   log level = 2

# Dónde se guardan los logs. %m se reemplaza por el nombre del cliente que
# se conecta. Así cada cliente tiene su propio archivo de log.
   log file = /var/log/samba/log.%m

# Tamaño máximo de cada archivo de log en kilobytes. Cuando se supera,
# Samba rota automáticamente el archivo (crea log.old y empieza uno nuevo).
   max log size = 1000

# ── SEGURIDAD Y PROTOCOLO ──

# Cifrado SMB. Para el laboratorio usamos "off" porque Windows 10/11
# bloquea las sesiones de invitado que negocian cifrado (error 0xc05d0004).
# Cuando un cliente accede a \\servidor, Windows se conecta primero al
# recurso oculto IPC$ como invitado para listar shares, y si el servidor
# intenta negociar cifrado en esa sesión guest, Windows la rechaza.
# En producción se recomienda "required" o "desired", pero requiere que
# NO haya acceso de invitados.
   smb encrypt = off

# Versión mínima del protocolo SMB que acepta el servidor.
# SMB1 está obsoleto y tiene vulnerabilidades graves (WannaCry lo explotaba).
# SMB2 y SMB3 son seguros y modernos. Ubuntu 24.04 y Arch Linux los soportan.
   min protocol = SMB2

# Versión mínima del protocolo para el lado servidor (equivalente a min protocol
# pero más explícito). Refuerza que NO aceptamos SMB1.
   server min protocol = SMB2

# ── INTERFACES DE RED ──

# A qué interfaces de red se enlaza Samba. "lo" es la interfaz loopback
# (localhost, para pruebas locales). <INTERFAZ_RED> es tu interfaz real.
# IMPORTANTE: Reemplaza <INTERFAZ_RED> por tu interfaz real (ej: eth0, ens33).
# Para encontrarla: ip a | grep -E '^[0-9]+:'
   interfaces = lo <INTERFAZ_RED>

# "yes" hace que Samba SOLO escuche en las interfaces listadas arriba.
# Esto es una medida de seguridad: si el servidor tiene varias interfaces,
# Samba solo responde en la red local, no en interfaces no deseadas.
   bind interfaces only = yes

# ── RENDIMIENTO ──

# Usa sendfile del kernel para transferir archivos. Mejora el rendimiento
# porque evita copiar datos entre el espacio de usuario y el kernel.
   use sendfile = yes

# Habilita lecturas asíncronas. Mejora rendimiento en redes rápidas.
   aio read size = 16384

# Habilita escrituras asíncronas. Mejora rendimiento en redes rápidas.
   aio write size = 16384

# ── PERMISOS ──

# Permisos por defecto para nuevos archivos creados a través de Samba.
# 0664 = rw-rw-r-- (propietario y grupo pueden leer+escribir; otros solo leer)
   create mask = 0664

# Permisos por defecto para nuevos directorios creados a través de Samba.
# 0775 = rwxrwxr-x (propietario y grupo: todo; otros: leer+acceder)
   directory mask = 0775

# Herencia de permisos: los nuevos archivos/carpetas creados dentro de un share
# heredan los permisos del directorio padre. Esto es muy útil para mantener
# consistencia (ej: si /contabilidad tiene SGID, los nuevos archivos lo respetan).
   inherit permissions = yes

# Herencia de ACLs: los nuevos archivos/carpetas heredan las ACLs del directorio
# padre. Fundamental para que nuestro modelo RBAC funcione correctamente con ACLs.
   inherit acls = yes

# Soporte para ACLs del sistema de archivos (POSIX ACLs vía setfacl/getfacl).
# "yes" permite que Samba use las ACLs del sistema para control de acceso.
   nt acl support = yes

# Mapear las ACLs de Samba (ACLs de Windows/NT) a ACLs POSIX del sistema.
# Esto permite que los permisos se reflejen correctamente entre ambos mundos.
   map acl inherit = yes

# ═══════════════════════════════════════════════════════════════════════════════
# SECCIÓN DE RECURSOS COMPARTIDOS (SHARES)
# ═══════════════════════════════════════════════════════════════════════════════
# Cada sección [nombre] define un directorio compartido que los clientes pueden
# montar. Las directivas dentro controlan quién puede acceder y cómo.
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# [publico] — Carpeta pública de DataCorp
# ─────────────────────────────────────────────────────────────────────────────
# Propósito: Directorio de lectura pública. Cualquier persona (incluso sin
# cuenta) puede VER los archivos. Solo los administradores pueden crear o
# modificar archivos aquí. Es como el tablón de anuncios de la empresa.
#
# Permisos: administradores=R+W | usuarios=R | invitados=R
[publico]
   # Descripción que aparece al explorar los shares desde un cliente
   comment = Carpeta publica de DataCorp - Solo lectura para todos

   # Ruta real en el disco del servidor
   path = /srv/datacorp/publico

   # Visible al explorar la red (aparece en "smbclient -L" o en el explorador de archivos)
   browseable = yes

   # NO se puede escribir por defecto. Solo lectura para la mayoría.
   writable = no

   # Deshabilitar cifrado SMB para este share de invitados.
   # RAZÓN: el cifrado global es "desired", pero Windows 10/11 bloquea
   # sesiones de invitado que negocian cifrado (error 0xc05d0004) porque
   # el acceso de invitado no tiene credenciales para derivar claves de cifrado.
   # Con "no" aquí sobreescribimos el "desired" global solo para este share.
   smb encrypt = no

   # Permitir acceso de invitados (sin usuario/contraseña).
   # Esto permite que cualquiera en la red vea el contenido.
   guest ok = yes

   # "write list" define EXCEPCIONES a "writable = no".
   # Los miembros del grupo @administradores SÍ pueden escribir.
   # El @ antes del nombre indica que es un GRUPO, no un usuario.
   write list = @administradores

   # Permisos para archivos y directorios creados por los que sí pueden escribir
   create mask = 0664
   directory mask = 0775

   # Forzar que el grupo de los nuevos archivos sea "administradores"
   force group = administradores

# ─────────────────────────────────────────────────────────────────────────────
# NOTA: Los shares de departamentos NO se definen aquí.
# setup_servidor.sh los genera dinámicamente al final del archivo según los
# grupos que el administrador configure durante la instalación.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# [privado] — Carpeta privada de la dirección
# ─────────────────────────────────────────────────────────────────────────────
# Propósito: Carpeta restringida a los administradores. Contiene información
# confidencial de la empresa. Nadie más puede acceder.
# Es como la caja fuerte de la empresa.
#
# Permisos: administradores=R+W | todos los demás=Sin acceso
[privado]
   comment = Carpeta privada - Solo administradores

   path = /srv/datacorp/privado

   # Visible en la red (los usuarios verán que existe, pero no podrán entrar)
   browseable = yes

   writable = yes

   guest ok = no

   # SOLO administradores
   valid users = @administradores

   write list = @administradores

   force group = administradores

   create mask = 0660
   directory mask = 0770

# ─────────────────────────────────────────────────────────────────────────────
# [admin] — Carpeta de administración del sistema
# ─────────────────────────────────────────────────────────────────────────────
# Propósito: Carpeta técnica de administración. Solo para administradores y
# NO visible en la red (no aparece al explorar). Para acceder hay que conocer
# la ruta exacta. Es como una puerta trasera oculta.
#
# Permisos: administradores=R+W | todos los demás=Sin acceso
[admin]
   comment = Administracion del sistema - Oculto, solo administradores

   path = /srv/datacorp/admin

   # NO visible al explorar la red. No aparece en smbclient -L ni en el
   # explorador de archivos. Para acceder hay que escribir la ruta completa:
   # \\servidor\admin o smb://servidor/admin
   browseable = no

   writable = yes

   guest ok = no

   # SOLO administradores
   valid users = @administradores

   write list = @administradores

   force group = administradores

   create mask = 0660
   directory mask = 0770
